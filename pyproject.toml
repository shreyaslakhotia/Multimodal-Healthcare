[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icu-mm"
version = "0.1.0"
requires-python = ">=3.11"
description = "Patient-separated first-48-hour ICU benchmark"
readme = "README.md"

[project.urls]
Repository = "https://github.com/shreyaslakhotia/Multimodal-Healthcare"
Documentation = "https://github.com/shreyaslakhotia/Multimodal-Healthcare/blob/shreyas/docs/RUNBOOK.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
