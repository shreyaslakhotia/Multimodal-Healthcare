[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icu-mm"
version = "0.1.0"
requires-python = ">=3.11"
description = "Patient-separated first-48-hour ICU benchmark"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
